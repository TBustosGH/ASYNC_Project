scalar DateTime

type Comment {
    id: ID!
    post: Post!
    user: User!
    content: String!
    createdAt: DateTime!
}

type countedCommentsResponse {
    count: Int!
    rows: [Comment!]!
}

type Query {
    getComments(parentId: ID!): countedCommentsResponse
}

type Mutation {
    createComment(
        postId: ID!, 
        userId: ID!, 
        content: String!
    ): Comment
    deleteComment(id: ID!): String!
    updateComment(
        id: ID!,
        content: String!
    ): Comment
}