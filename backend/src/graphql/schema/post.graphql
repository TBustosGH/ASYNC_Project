scalar DateTime

type Post {
    id: ID!
    user: User!
    content: String!
    comments: [Comment!]!
    createdAt: DateTime!
}

type Query {
    getAllPosts: [Post!]!
    getPost(id: ID!): Post
}

type Mutation {
    createPost(
        userId: ID!, 
        content: String!
    ): Post
    deletePost(id: ID!): String!
    updatePost(
        id: ID!,
        content: String!
    ): Post
}